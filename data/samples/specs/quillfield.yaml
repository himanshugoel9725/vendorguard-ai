# Quillfield Analytics (fictional): dashboards built from customer data uploads. Mid maturity.
# Targets (met/partial/not_met/missing): 12/6/3/4. Contains one prompt-injection paragraph, which an
# assessor must ignore (regression test for task 11.1).
