[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "vendorguard"
version = "1.0.0"
description = "Multi-agent, evidence-cited third-party security risk assessment."
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.12"
dependencies = [
    "pydantic>=2.7",
    "pydantic-settings>=2.3",
    "pyyaml>=6.0",
    "typer>=0.12",
    "rich>=13.7",
    "httpx>=0.27",
    "tenacity>=8.3",
    "pypdf>=4.2",
    "rank-bm25>=0.2.2",
    "numpy>=1.26",
    "jinja2>=3.1",
    "fastapi>=0.111",
    "uvicorn>=0.30",
    "python-multipart>=0.0.9",
    "prometheus-client>=0.20",
]

[project.optional-dependencies]
letta = ["letta-client"]

[project.scripts]
vg = "vendorguard.cli.main:app"

[dependency-groups]
dev = [
    "pytest>=8.2",
    "pytest-cov>=5.0",
    "respx>=0.21",
    "ruff>=0.5",
    "mypy>=1.10",
    "types-pyyaml",
    "pre-commit>=3.7",
    "fpdf2>=2.7",
    "matplotlib>=3.9",
    "pip-audit>=2.7",
]
docs = ["mkdocs-material>=9.5"]
ui = [
    "streamlit>=1.50",
]

[tool.hatch.build.targets.wheel]
packages = ["src/vendorguard"]

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]
extend-exclude = ["*.md"]  # ruff would reformat code blocks inside the docs

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM", "S"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101", "S105", "S106", "S311", "S603"]  # asserts, fake secrets, seeded random, subprocess

[tool.mypy]
python_version = "3.12"
strict = true
files = ["src"]
plugins = ["pydantic.mypy"]

[[tool.mypy.overrides]]
module = ["rank_bm25"]
ignore_missing_imports = true  # the library ships no type stubs

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers --import-mode=importlib -m 'not ollama and not letta and not jev and not hosted'"
markers = [
    "ollama: needs a local Ollama server (skipped by default)",
    "letta: needs a Letta server (skipped by default)",
    "jev: needs a Jev API key (skipped by default)",
    "hosted: calls a hosted LLM with your API key (OpenAI spends credits, Groq uses its free plan; skipped by default)",
]

[tool.coverage.run]
source = ["vendorguard"]
branch = true

[tool.coverage.report]
fail_under = 80  # the gate from task 3.7: `make check` and CI fail below this
show_missing = true
skip_empty = true
