[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "vendorguard"
version = "0.1.0"
description = "Multi-agent, evidence-cited third-party security risk assessment."
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.12"
dependencies = [
    "pydantic>=2.7",
    "pydantic-settings>=2.3",
    "pyyaml>=6.0",
    "typer>=0.12",
    "rich>=13.7",
    "httpx>=0.27",
    "tenacity>=8.3",
    "pypdf>=4.2",
    "rank-bm25>=0.2.2",
    "numpy>=1.26",
    "jinja2>=3.1",
    "fastapi>=0.111",
    "uvicorn>=0.30",
    "python-multipart>=0.0.9",
    "prometheus-client>=0.20",
]

[project.optional-dependencies]
letta = ["letta-client"]

[project.scripts]
vg = "vendorguard.cli.main:app"

[dependency-groups]
dev = [
    "pytest>=8.2",
    "pytest-cov>=5.0",
    "respx>=0.21",
    "ruff>=0.5",
    "mypy>=1.10",
    "types-pyyaml",
    "pre-commit>=3.7",
    "fpdf2>=2.7",
    "matplotlib>=3.9",
    "pip-audit>=2.7",
]
docs = ["mkdocs-material>=9.5"]

[tool.hatch.build.targets.wheel]
packages = ["src/vendorguard"]
