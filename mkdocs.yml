site_name: VendorGuard AI
site_description: Multi-agent assistant for third-party security risk assessment
site_url: https://himanshugoel9725.github.io/vendorguard-ai/
repo_url: https://github.com/himanshugoel9725/vendorguard-ai
repo_name: vendorguard-ai
edit_uri: edit/main/docs/
docs_dir: docs
strict: true

theme:
  name: material
  palette:
    scheme: slate          # always dark (near-black, see stylesheets/extra.css)
    primary: black
    accent: blue
  features:
    - navigation.sections
    - navigation.top
    - content.code.copy

extra_css:
  - stylesheets/extra.css

# Build notes for contributors, not part of the product documentation.
exclude_docs: |
  PLAN.md
  PROGRESS.md

markdown_extensions:
  - admonition
  - tables
  - toc:
      permalink: true
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format

nav:
  - Home: index.md
  - Architecture: architecture.md
  - CLI: cli.md
  - REST API: api.md
  - Web UI: ui.md
  - Configuration: CONFIG.md
  - Evaluation: EVALUATION.md
  - Decisions: DECISIONS.md
